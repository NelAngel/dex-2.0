
name: SD LYGANE - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SD LYGANE APK
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Detectar la carpeta del proyecto
      - name: Detect project directory
        shell: bash
        run: |
          if [ -f "build.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "SD-LYGANE/build.gradle.kts" ] && [ -f "SD-LYGANE/app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=SD-LYGANE" >> "$GITHUB_ENV"
          else
            echo "ERROR: No se encontró el proyecto Android."
            exit 1
          fi

      # 3. Configurar Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Configurar Gradle 8.11.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # 5. Configurar Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Instalar Android SDK 35
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 7. Compilar APK Debug
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 8. Compilar APK Release
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      # 9. Guardar APKs
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SD-LYGANE-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
