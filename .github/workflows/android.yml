
name: SD LYGANE - Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SD LYGANE APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect project directory
        shell: bash
        run: |
          set -e

          if [ -f "build.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "SD-LYGANE/build.gradle.kts" ] && [ -f "SD-LYGANE/app/build.gradle.kts" ]; then
            echo "PROJECT_DIR=SD-LYGANE" >> "$GITHUB_ENV"
          else
            echo "Android project not found"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android Command-line Tools
        shell: bash
        run: |
          set -e

          SDK="$RUNNER_TEMP/android-sdk"

          mkdir -p "$SDK/cmdline-tools/latest"
          mkdir -p "$SDK/platform-tools"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "Downloading Android Command-line Tools..."

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"

          mkdir -p "$RUNNER_TEMP/android-tools"

          unzip -q "$RUNNER_TEMP/android-tools.zip" \
            -d "$RUNNER_TEMP/android-tools"

          echo "Installing tools..."

          cp -R "$RUNNER_TEMP/android-tools/cmdline-tools/." \
            "$SDK/cmdline-tools/latest/"

          chmod -R u+rwX "$SDK/cmdline-tools/latest/"
          chmod +x "$SDK/cmdline-tools/latest/bin/sdkmanager"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK installed at: $SDK"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses \
            || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          adb version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SD-LYGANE-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
